<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
    :root { --bg: #fff; --fg: #222; --muted: #666; --line: #e0e0e0; --accent: #1565c0; }
    @media (prefers-color-scheme: dark) {
        :root { --bg: #292a2d; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --accent: #8ab4f8; }
    }
    body { margin: 0; width: 240px; background: var(--bg); color: var(--fg);
           font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .env { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .chip { padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 12px; letter-spacing: 0.05em; }
    .host { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row { padding: 10px 12px; }
    .row + .row { padding-top: 0; }
    label.toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .slider-head { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .slider-head span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
    /* switch-style toggle */
    input.switch { appearance: none; -webkit-appearance: none; margin: 0; cursor: pointer;
                   position: relative; width: 34px; height: 18px; border-radius: 9px;
                   background: var(--line); transition: background 0.15s; flex-shrink: 0; }
    input.switch::before { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
                           border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.3);
                           transition: transform 0.15s; }
    input.switch:checked { background: var(--accent); }
    input.switch:checked::before { transform: translateX(16px); }
    input.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    label.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    input#showHost { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
    .disabled { opacity: 0.45; pointer-events: none; }
</style>
</head>
<body>
    <div class="env" id="env"></div>
    <div class="row">
        <label class="toggle">Show banner <input type="checkbox" role="switch" class="switch" id="enabled"></label>
    </div>
    <div class="row options" id="hostRow">
        <label class="check"><input type="checkbox" id="showHost"> Show hostname in banner</label>
    </div>
    <div class="row options" id="opacityRow">
        <div class="slider-head"><span>Banner opacity</span><span id="opacityVal"></span></div>
        <input type="range" id="opacity" min="10" max="100" step="5">
    </div>
    <script src="envs.js"></script>
    <script src="popup.js"></script>
</body>
</html>
